name: Continuous Integration Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Run Quality & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/checkout@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Run ESLint Check
        run: npm run lint

      - name: 5. Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: 6. Test Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000"
